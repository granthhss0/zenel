<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zenel</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="logo">
        <span class="logo-mark">Z</span>
        <span class="logo-text">zenel</span>
      </div>

      <nav class="nav-links">
        <a href="#" class="nav-item active" data-view="home">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Home
        </a>
        <a href="#" class="nav-item" data-view="search">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Search
        </a>
        <a href="#" class="nav-item" data-view="library">
          <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Library
        </a>
      </nav>

      <div class="sidebar-section">
        <p class="sidebar-label">API Instance</p>
        <div class="api-selector">
          <select id="api-instance">
            <option value="https://ohio.monochrome.tf">Ohio (Monochrome)</option>
            <option value="https://virginia.monochrome.tf">Virginia (Monochrome)</option>
            <option value="https://oregon.monochrome.tf">Oregon (Monochrome)</option>
            <option value="https://frankfurt.monochrome.tf">Frankfurt (Monochrome)</option>
            <option value="https://triton.squid.wtf">Triton (Squid)</option>
            <option value="https://aether.squid.wtf">Aether (Squid)</option>
            <option value="custom">Custom...</option>
          </select>
          <input id="custom-api" type="text" placeholder="https://your-instance.com" style="display:none" />
        </div>
      </div>

      <div class="sidebar-section">
        <p class="sidebar-label">Queue</p>
        <div id="queue-list"></div>
      </div>
    </aside>

    <!-- Main content -->
    <main id="content">

      <!-- Home View -->
      <section id="view-home" class="view active">
        <div class="view-header">
          <h1>Good <span id="greeting-time">evening</span></h1>
          <p class="subtitle">Stream hi-fi music via the TIDAL hifi API</p>
        </div>
        <div class="featured-search">
          <div class="big-search-wrap">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="home-search" type="text" placeholder="Search for a song, album, or artist…" />
          </div>
        </div>
        <div id="home-results" class="results-grid hidden"></div>
      </section>

      <!-- Search View -->
      <section id="view-search" class="view">
        <div class="view-header">
          <h1>Search</h1>
        </div>
        <div class="search-bar-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search-input" type="text" placeholder="Tracks, albums, artists…" />
          <div class="search-type-tabs">
            <button class="tab active" data-type="tracks">Tracks</button>
            <button class="tab" data-type="albums">Albums</button>
            <button class="tab" data-type="artists">Artists</button>
          </div>
        </div>
        <div id="search-results" class="results-list"></div>
      </section>

      <!-- Library View -->
      <section id="view-library" class="view">
        <div class="view-header">
          <h1>Library</h1>
        </div>
        <div id="library-content">
          <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
            <p>Your liked tracks will appear here.</p>
            <p class="small">Like a song by pressing the ♥ button.</p>
          </div>
        </div>
      </section>

      <!-- Album View -->
      <section id="view-album" class="view">
        <div id="album-detail"></div>
      </section>

      <!-- Artist View -->
      <section id="view-artist" class="view">
        <div id="artist-detail"></div>
      </section>

    </main>
  </div>

  <!-- Now Playing Bar -->
  <footer id="player">
    <div class="player-left">
      <img id="player-cover" src="" alt="" />
      <div class="player-meta">
        <span id="player-title">—</span>
        <span id="player-artist">No track playing</span>
      </div>
      <button id="like-btn" class="icon-btn" title="Like">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
      </button>
    </div>
    <div class="player-center">
      <div class="player-controls">
        <button id="shuffle-btn" class="icon-btn small" title="Shuffle">
          <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
        </button>
        <button id="prev-btn" class="icon-btn" title="Previous">
          <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"/><line x1="5" y1="19" x2="5" y2="5"/></svg>
        </button>
        <button id="play-btn" class="play-btn" title="Play/Pause">
          <svg id="play-icon" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <svg id="pause-icon" viewBox="0 0 24 24" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        </button>
        <button id="next-btn" class="icon-btn" title="Next">
          <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" y1="5" x2="19" y2="19"/></svg>
        </button>
        <button id="repeat-btn" class="icon-btn small" title="Repeat">
          <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
        </button>
      </div>
      <div class="progress-row">
        <span id="time-current">0:00</span>
        <div id="progress-bar" class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
          <div id="progress-thumb" class="progress-thumb"></div>
        </div>
        <span id="time-total">0:00</span>
      </div>
    </div>
    <div class="player-right">
      <span id="quality-badge" class="quality-badge hidden"></span>
      <svg class="volume-icon" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="1" />
    </div>
  </footer>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="hidden">
    <div class="spinner"></div>
  </div>

  <!-- Notification toast -->
  <div id="toast" class="hidden"></div>

  <audio id="audio-element"></audio>

  <script src="js/api.js"></script>
  <script src="js/player.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
